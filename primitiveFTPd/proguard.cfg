-optimizationpasses 5
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-dontpreverify
-verbose
-optimizations !code/simplification/arithmetic,!field/*,!class/merging/*

-keep public class * extends android.app.Activity
-keep public class * extends android.app.Application
-keep public class * extends android.app.Service
-keep public class * extends android.content.BroadcastReceiver
-keep public class * extends android.content.ContentProvider
-keep public class * extends android.app.backup.BackupAgentHelper
-keep public class * extends android.preference.Preference
#-keep public class com.android.vending.licensing.ILicensingService

-keepclasseswithmembernames class * {
    native <methods>;
}

-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet);
}

-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

-keepclassmembers class * extends android.app.Activity {
   public void *(android.view.View);
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

-keep class * implements android.os.Parcelable {
  public static final android.os.Parcelable$Creator *;
}

# "group = "com.github.tony19", name = "logback-android"
-keepclassmembers class ch.qos.logback.classic.pattern.* { <init>(); }
-keepclassmembers class ch.qos.logback.** { *; }
-keepclassmembers class org.slf4j.impl.** { *; }
-keep interface org.slf4j.** { *; }
-keepattributes *Annotation*
-dontwarn ch.qos.logback.core.**
-dontwarn javax.mail.**

# 保护 FTP Server 和 MINA 核心类不被混淆（它们会通过反射加载）
-keep class org.apache.ftpserver.** { *; }
-keep class org.apache.mina.** { *; }
-keep class org.apache.sshd.** { *; }
-keep class org.bouncycastle.** { *; }

# 但仍然忽略这些库的编译警告
-dontwarn org.apache.ftpserver.**
-dontwarn org.apache.mina.**
-dontwarn org.apache.sshd.**
-dontwarn org.bouncycastle.**
-dontwarn com.sshtools.**
-dontwarn java.awt.**
-dontwarn socks.SocksDialog

# 忽略 HttpClient 5 引起的可选依赖缺失警告
-dontwarn com.aayushatharva.brotli4j.**
-dontwarn org.apache.commons.compress.**
-dontwarn jdk.net.**
-dontwarn org.apache.hc.client5.http.entity.compress.**
-dontwarn org.apache.hc.client5.http.impl.io.DefaultHttpClientConnectionOperator

# Keep Shizuku UserService and related classes
-keep class org.primftpd.shizuku.ShizukuUserService { *; }
-keep class org.primftpd.shizuku.aidl.** { *; }
-keep class * extends android.os.IInterface { *; }
-keepclassmembers class * extends android.os.Binder {
    public <methods>;
}
