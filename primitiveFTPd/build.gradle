    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }
}

// AGP 9
androidComponents {
    // release 产物用自增后的版本号（延迟到执行期求值，保证与写回文件的数值一致）；
    // debug 仍用 version.properties 里的当前值。
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.forEach { output ->
            output.versionCode.set(providers.provider { resolveVersion()['code'] })
            output.versionName.set(providers.provider { resolveVersion()['name'] })
        }
    }
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("shizuku-ftp-${variant.buildType}.apk")
        }
    }
}

