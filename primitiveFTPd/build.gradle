plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.android
    alias libs.plugins.maven.publish
    alias libs.plugins.kotlin.compose

    alias libs.plugins.kotlin.parcelize
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.toolchain.get())
    }
}

android {
    namespace = "org.primftpd"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "org.primftpd.shizuku"
        versionCode = 70
        versionName = "v1.1.1"

        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
            shrinkResources = false
            applicationIdSuffix = ".debug"
        }
        release {
            //debuggable = true
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
        }
    }
    buildFeatures {
        compose = true
        aidl = true
    }
    sourceSets {
        main {
            manifest {
                srcFile 'AndroidManifest.xml'
            }
            java {
                srcDirs = ['src']
            }
            kotlin {
                srcDirs = ['src']
            }
            aidl {
                srcDirs = ['src/main/aidl']
            }
            res {
                srcDir 'res'
            }
            assets {
                srcDirs = ['assets']
            }
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE',
                         'META-INF/NOTICE',
                         'META-INF/DEPENDENCIES',
                         'META-INF/BCKEY.SF',
                         'META-INF/BCKEY.DSA']
        }
    }

    lint {
        abortOnError = false
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {

    implementation project(':pftpd-pojo-lib')
    implementation project(':sshd-core-0.14.0')

    implementation libs.androidx.activity
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.appcompat
    implementation libs.androidx.coordinatorlayout
    implementation libs.androidx.documentfile
    implementation libs.androidx.fragment
    implementation libs.androidx.preference
    implementation libs.androidx.recyclerview
    implementation libs.androidx.compose.animation.graphics
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
    implementation libs.androidx.ui.tooling.preview

    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.foundation
    implementation libs.androidx.runtime
    implementation libs.androidx.material3
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.navigation.compose
    implementation libs.androidx.compose.material.icons.core
    implementation libs.vico.compose.m3
    implementation libs.haze
    implementation libs.haze.blur
    implementation libs.haze.blur.materials
    //implementation libs.androidx.compose.material.icons.extended
    //取色
    implementation libs.androidx.palette.ktx


    coreLibraryDesugaring(libs.google.desugar)
    implementation libs.google.material

    implementation(libs.ftpserver.api)
    implementation(libs.ftpserver.core) {
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'org.springframework', module: 'spring-context'
        exclude group: 'org.springframework', module: 'spring-beans'
    }

    implementation(libs.bouncycastle.bcprov)
    implementation(libs.bouncycastle.bcpkix)
    implementation(libs.bouncycastle.bcutil)

    implementation(libs.logback.android)
    implementation(libs.mina.core)
    implementation(libs.slf4j.api)
    implementation(libs.eventbus)
    implementation(libs.httpclient5)
    implementation(libs.libsuperuser)
    implementation(libs.zxing) {
        exclude group: 'com.android.support'
    }

    implementation libs.shizuku.api
    implementation libs.shizuku.provider
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.primftpd.shizuku'
            artifactId = 'app'
            version = 'latest-SNAPSHOT'
            artifact file('build/outputs/apk/debug/primitiveFTPd-debug.apk')
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/rD227/shizuku-ftp")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME") ?: 'never-mind'
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
