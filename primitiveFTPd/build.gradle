// ---------- 版本号自增 ----------
// 只在真正构建 release 时自增：VERSION_CODE + 1，VERSION_NAME 末位 + 1（1.2.6 -> 1.2.7）。
// 用 provider 延迟求值的原因：defaultConfig 在配置阶段就把版本号交给了 AGP，
// 那时再改 version.properties 只会写文件、改不到本次构建产物（旧实现就是这样漂移的）。
def versionPropsFile = file('version.properties')
def versionProps = new Properties()

if (versionPropsFile.canRead()) {
    versionProps.load(new FileInputStream(versionPropsFile))
} else {
    throw new GradleException("Could not read version.properties!")
}

def versionTaskGraph = gradle.taskGraph
def releaseBuildTask = ~/^(assemble|bundle|package|install|publish)Release(Bundle|Apk)?$/
def versionLock = new Object()
def nextVersion = null
def versionPersisted = false

// 任务图就绪前（配置阶段、Android Studio sync）一律返回 false，避免误写文件
def isReleaseBuild = {
    try {
        return versionTaskGraph.allTasks.any { releaseBuildTask.matcher(it.name).matches() }
    } catch (Exception ignored) {
        return false
    }
}

def bumpPatch = { String name ->
    def parts = name?.trim()?.split('\\.')
    // 不是 x.y.z、或末位不是数字时原样返回，避免把文件写坏
    if (parts == null || parts.length < 3 || !(parts[-1] ==~ /\d+/)) {
        return name
    }
    parts[parts.length - 1] = (parts[-1].toInteger() + 1).toString()
    return parts.join('.')
}

// 取值是纯函数（文件当前值 + 1），所以 provider 无论被求值几次、在哪个阶段求值，
// 结果都一致；落盘只做一次，且只在 release 构建时做。
def resolveVersion = {
    synchronized (versionLock) {
        if (nextVersion == null) {
            nextVersion = [code: versionProps['VERSION_CODE'].toInteger() + 1,
                           name: bumpPatch(versionProps['VERSION_NAME'])]
        }
        if (!versionPersisted && isReleaseBuild()) {
            versionPersisted = true
            versionProps['VERSION_CODE'] = nextVersion['code'].toString()
            versionProps['VERSION_NAME'] = nextVersion['name']
            versionProps.store(versionPropsFile.newWriter(), null)
        }
        return nextVersion
    }
}

